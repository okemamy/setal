name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Tests
        run: swift test
      - name: Build Setal.app
        run: ./build-app.sh
      - name: Package
        run: ditto -c -k --keepParent build/Setal.app "Setal-${GITHUB_REF_NAME}.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Setal-${GITHUB_REF_NAME}.zip" \
            --title "Setal ${GITHUB_REF_NAME}" --generate-notes
